[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsppk"
version = "3.5.0"
description = "Neighbourhood Subgraph Pairwise Pathway Kernel for graph feature extraction."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Fabrizio Costa" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "multiprocessing-on-dill>=3.5.0a4",
  "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/fabriziocosta/NSPPK"
Documentation = "https://nsppk.readthedocs.io/en/latest/"
Repository = "https://github.com/fabriziocosta/NSPPK"
Issues = "https://github.com/fabriziocosta/NSPPK/issues"

[project.optional-dependencies]
docs = [
  "sphinx>=7.2,<9",
  "myst-parser>=2.0,<5",
  "sphinx-rtd-theme>=2.0,<4",
]
tuning = [
    "scikit-optimize>=0.10.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["nsppk", "nsppk_tuning", "nsppk_leaderboard", "importance_nsppk", "recursive_nsppk", "hash", "graph_io", "utils"]
